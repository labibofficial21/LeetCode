	<body>
		<h1>Two Sum</h1>

		<script>
			let nums = [2, 7, 11, 15];
			let target = 9;

			var twoSum = function (nums, target) {
				let answer;
				let result = [];
				for (let i = 0; i < nums.length; i++) {
					// console.log(`isi dari index ke ${i} adalah ${nums[i]}`);
					// console.log(nums[i] + "a");
					for (let j = 0; j < nums.length; j++) {
						answer = nums[j] + nums[i];
						// console.log(`${nums[j]} + ${nums[i]} = ${answer}`);
						// console.log(answer);
						if (answer == target && i != j) {
							// console.log(answer);
							console.log("benar");
							result.push(i);
							result.push(j);
							// console.log(answer);
							// console.log(result.push(i));
							return result;
							// break;
						} else {
							// console.log("salah");
						}
					}
					// console.log(`index ke ${i} berisi ${nums[i]}`);
				}
			};
			// console.log(result);
			console.log(twoSum(nums, target));
		</script>
	</body>
