	<body>
		<h1>Reverse String</h1>
		<pre>
        tulis sebuah function yang membalikkan sebuah string. input string 
        diberikan dalam bentuk array yang berisi karakter dengan var s.
    </pre>

		<script>
			var reverseString = function (s) {
				console.log(s.reverse());
			};

			reverseString(["h", "e", "l", "l", "o"]);
		</script>
	</body>
