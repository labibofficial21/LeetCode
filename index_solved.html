		<h1>Length of Last Word</h1>
		<pre>
        diberikan string s yang konsisten berupa kata dan spasi, return length
        of the last word dalam 1 string kata tersebut.
    </pre>
		<script>
			var lengthOfLastWord = function (s) {
				let result = s.trim().split(" ");
				let result1 = result.reverse()[0].length;

				console.log(result);
				console.log(result1);

				return result1;
			};

			console.log(lengthOfLastWord("luffy is still joyboy"));
		</script>
